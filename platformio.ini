; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain "pio run" builds and flashes over USB; the ota environment is only used when asked for (-e ota)
default_envs = adafruit_matrixportal_esp32s3

[env:adafruit_matrixportal_esp32s3]
; Pinned, like the libraries below, so every machine and CI build the same firmware. Newer
; platforms bring Arduino core 3, which renames the network classes this code uses
platform = platformio/espressif32@7.0.1
board = adafruit_matrixportal_esp32s3
board_build.filesystem = littlefs
board_build.flash_size = 8MB
framework = arduino
extra_scripts =
    ; Writes include/FirmwareVersion.h from git describe. Runs first: the UI build rewrites tracked
    ; files (hash.txt, include/ui), which would make every build look modified
    pre:version.py
    pre:prebuild-ui.py
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
; The Arduino core defaults to C++11; std::string_view needs C++17
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ;Drawing goes through our own IDisplay with 24-bit Color, so the driver doesn't need Adafruit_GFX
    -D NO_GFX
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ;Lets the web UI install the latest GitHub release of this repository (its firmware.bin asset,
    ;published by .github/workflows/release.yml). The repository must be public
    -D UPDATE_GITHUB_REPO=\"mrquentin/MatrixController-S3\"

; Flashes over WiFi instead of USB: pio run -e ota -t upload
; Needs the update password (set in the web UI) in the MATRIX_UPDATE_PASSWORD environment variable.
; The board connects back to this computer, so the firewall must let espota through
[env:ota]
extends = env:adafruit_matrixportal_esp32s3
upload_protocol = espota
upload_port = matrixcontroller.local
upload_flags =
    --port=3232
    --auth=${sysenv.MATRIX_UPDATE_PASSWORD}

; Unit tests that run on the computer, not the board: pio test -e native
; Only code without Arduino dependencies is built, as listed in build_src_filter
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<apps/ConfigSchema.cpp>
    +<apps/F1Timing.cpp>
    +<display/Font5x7.cpp>
    +<display/IDisplay.cpp>
    +<display/Shapes.cpp>
    +<display/Text.cpp>
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=gnu++17
    -Wall
