# Every push to main (a merged pull request) is checked again, then semantic-release reads the
# conventional commits since the last release to decide the next version. If there's one (any
# feat or fix), it builds the firmware with that version, tags it and publishes a GitHub release
# with firmware.bin, which boards install from their Firmware page. Commits like docs or chore
# release nothing.
name: Release

on:
  push:
    branches: [main]

# One release at a time, never cancelled halfway through publishing
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # A called workflow gets at most what its caller grants, and GitHub refuses to start the run
    # if any of its jobs asks for more, even one that's skipped here (the PR title check)
    permissions:
      contents: read
      pull-requests: read

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # Tags and releases
      contents: write
      # Comments on the pull requests and issues a release includes
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release reads the commits and tags since the last release
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-esp32-${{ hashFiles('platformio.ini') }}
      - name: Install the release tools and the UI's dependencies
        run: |
          npm ci
          npm ci --prefix ui
      - run: pip install platformio
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
